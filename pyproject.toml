[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe42"
version = "0.1.0"
description = "Auditable multiscale fault-discovery research and GeoTIFF submission pipeline for DOE GEMS"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "rasterio>=1.3.10",
  "numba>=0.59",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
